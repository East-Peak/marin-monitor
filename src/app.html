<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<script nonce="%sveltekit.nonce%">
			// A tap before the dashboard is interactive is kept and replayed once it is
			// (src/lib/dashboard/early-taps.ts).
			addEventListener(
				'click',
				function (e) {
					var b = e.target instanceof Element ? e.target.closest('button') : null;
					if (b && b.closest('[data-hydrated="false"]'))
						(window.__earlyTaps = window.__earlyTaps || []).push(b);
				},
				true
			);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
