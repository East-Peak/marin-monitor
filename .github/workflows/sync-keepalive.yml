name: Sync Keepalive

# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity; that silently stopped every sync job in 2026. This calls
# the enable API for each sync workflow (and itself) weekly, with no commits —
# weekly, so a dropped scheduler run or two cannot add up to 60 days.
#
# It runs on the same scheduler it protects, so it cannot catch its own
# failure. The independent check is external: stale sync data turns
# /api/health 503, which the UptimeRobot monitor alerts on.
on:
  schedule:
    - cron: '23 7 * * 3'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable sync workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          failed=0
          for workflow in \
            sync-camp-prices.yml \
            sync-cappuccino.yml \
            sync-coffee-index.yml \
            sync-dog-walker.yml \
            sync-grocery-basket.yml \
            sync-ikon-pass.yml \
            sync-keepalive.yml \
            sync-rivian-lease.yml \
            sync-wine-index.yml
          do
            if ! gh workflow enable "$workflow"; then
              echo "::error::could not enable $workflow"
              failed=1
            else
              echo "enabled $workflow"
            fi
          done
          exit "$failed"
